version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_as_universidad_prod
    ports:
      - "127.0.0.1:27017:27017" 
    restart: always
    volumes:
      - mongo_data:/data/db 
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin_datademy
      - MONGO_INITDB_ROOT_PASSWORD=TuPasswordSuperSeguro123 #Esto se debe cambiar y en el .env tambien.

  redis-datademy:
    image: redis:alpine
    container_name: redis_datademy_prod

    expose: 
      - "6379"
    restart: always

  backend-datademy:
    build: ./backend 
    container_name: backend_datademy_prod
    ports:
      - "3000:3000"
    restart: always
    env_file: 
      - ./backend/.env.prod 
    
    command: npx --node-options="--max-old-space-size=2048" npm run start:prod
    
    depends_on:
      - mongodb
      - redis-datademy
    environment:
      - PORT=3000
      - FRONTEND_URL=https://tu-dominio-real.com 
      - MONGODB_URI=mongodb://admin_datademy:TuPasswordSuperSeguro123@mongodb:27017/datademy?authSource=admin
      - REDIS_URL=redis://redis-datademy:6379

  frontend-datademy:
    build: ./datademy
    container_name: frontend_datademy_prod
    ports:
      - "80:80"
    restart: always
    depends_on:
      - backend-datademy

volumes:
  mongo_data: